name: KateTrade Build & Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
    paths:
      - '**/*.rs'
      - 'Dockerfile'
      - '**/test-and-build.yaml'

jobs:
  test-and-build:
    permissions: write-all
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check compiler warnings
        run: cargo rustc -- -D warnings

      - name: Test application
        run: cargo test --verbose --all-features

      - name: Run ignored tests (tests specific to run in the CI/CD pipeline)
        run: AWS_ACCESS_KEY_ID=${{secrets.AWS_ACCESS_KEY_ID }} AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} cargo test --verbose --all-features -- --ignored

      - name: Debug build
        run: cargo build --verbose

      - name: Release build
        run: cargo build --release --verbose

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/katetrade:${{ github.event.number }} .

      - name: Push Docker image to GitHub Container Registry
        run: docker push ghcr.io/${{ github.repository_owner }}/katetrade:${{ github.event.number }}
        if: github.event_name != 'pull_request'