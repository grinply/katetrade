[package]
name = "katetrade"
version = "0.2.0"
edition = "2021"

[dependencies]
rand = "0.9.3"
rand_pcg = "0.3.1"
sysinfo = "0.33.0"
itertools = "0.13.0"
clap = { version = "4.5.18", features = ["derive"] }
ureq = { version = "2.10.1", features = ["json", "charset"] }
crossbeam = "0.8"
chrono = "0.4.38"
once_cell = "1.20.2"
strum = "0.26"
strum_macros = "0.26.4"
cli-candlestick-chart = "0.4.1"
lazy_static = "1.5.0"
anyhow = "1"
serde_json = "1.0.128"
serde = { version = "1.0.210", features = ["derive"] }
crossbeam-channel = "0.5.13"
rusty-s3 = "0.5.0"
simple_bar = "0.2.2"
rayon = "1.10"
ta = "0.5.0"
dyn-clone = "1.0"
