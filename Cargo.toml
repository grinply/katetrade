[package]
name = "katetrade"
version = "0.2.0"
edition = "2021"

[dependencies]
rand = "0.8.5"
sysinfo = "0.32.0"
itertools = "0.13.0"
clap = { version = "4.5.18", features = ["derive"] }
ureq = { version = "2.10.1", features = ["json", "charset"] }
crossbeam = "0.8"
chrono = "0.4.38"
once_cell = "1.20.2"
strum = "0.26"
strum_macros = "0.26.4"
cli-candlestick-chart = "0.4.1"
lazy_static = "1.5.0"
anyhow = "1"
serde_json = "1.0.128"
serde = { version = "1.0.210", features = ["derive"] }
crossbeam-channel = "0.5.13"


